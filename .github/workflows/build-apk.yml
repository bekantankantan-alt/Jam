
name: Build APK from ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - "UBAH_JAM_FOTO_ANDROID_PROJECT.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir project
          unzip UBAH_JAM_FOTO_ANDROID_PROJECT.zip -d project

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: project
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UBAH-JAM-FOTO-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
